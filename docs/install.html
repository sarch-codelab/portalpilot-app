<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Instalar Portal Pilot</title>
    <style>
        :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f2f7; color: #1c1c1e; }
        main { width: min(90%, 420px); padding: 2rem; text-align: center; box-sizing: border-box; }
        h1 { margin: 0 0 .5rem; font-size: 2rem; }
        p { color: #636366; line-height: 1.5; }
        .button { display: inline-block; margin-top: 1rem; padding: .9rem 1.4rem; border-radius: 12px; background: #007aff; color: white; font-weight: 600; text-decoration: none; }
        .note { margin-top: 1.5rem; font-size: .9rem; }
    </style>
</head>
<body>
    <main>
        <h1>Portal Pilot App</h1>
        <p>Versión 0.1.0</p>
        <a class="button" href="itms-services://?action=download-manifest&amp;url=https://sarch-codelab.github.io/portalpilot-app/manifest.plist">Instalar en iPhone</a>
        <p class="note">Abre esta página desde Safari en el iPhone y toca el botón de instalación.</p>
    </main>
</body>
</html>
