<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte | Portal Pilot</title>

<style>
@page {
  size: A4;
  margin: 10mm 10mm 12mm;
}

* { box-sizing: border-box; }

:root {
  --ink: #151a2d;
  --text: #172033;
  --muted: #697386;
  --line: #dfe4eb;
  --soft: #f4f6f9;
  --soft-2: #f8f9fb;
  --white: #fff;
  --accent: #151a2d;
}

html, body { margin: 0; padding: 0; }

body {
  background: #eef1f5;
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 9px;
  line-height: 1.45;
}

.toolbar {
  width: min(210mm, calc(100% - 24px));
  margin: 14px auto 0;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.toolbar button {
  border: 1px solid #cbd2dc;
  border-radius: 6px;
  background: var(--ink);
  color: #fff;
  padding: 8px 12px;
  font: inherit;
  cursor: pointer;
}

.page {
  width: 210mm;
  min-height: 297mm;
  margin: 20px auto;
  padding: 12mm;
  background: #fff;
  box-shadow: 0 4px 25px rgba(0,0,0,.08);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 18px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--ink);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 42px;
  height: 42px;
  border-radius: 11px;
  background: var(--ink);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -1px;
  overflow: hidden;
}

.brand-mark img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.brand-name {
  margin: 0;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -.8px;
}

.brand-tagline {
  margin-top: 2px;
  color: var(--muted);
  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.meta-box {
  width: 245px;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}

.meta-title {
  padding: 7px 9px;
  background: var(--ink);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.meta-body { padding: 7px 9px; }

.meta-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 2px 0;
}

.meta-row span { color: var(--muted); }
.meta-row strong { text-align: right; }

.report-intro {
  margin-top: 14px;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
}

.eyebrow {
  color: var(--muted);
  font-size: 7px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 4px;
}

.report-title {
  margin: 0;
  font-size: 22px;
  line-height: 1.15;
  letter-spacing: -.7px;
}

.report-description {
  margin: 6px 0 0;
  color: #596273;
  font-size: 9px;
}

.period {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--soft-2);
  font-size: 7.5px;
  font-weight: 700;
}

.section {
  margin-top: 13px;
  break-inside: avoid;
}

.section-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 6px;
}

.section-title h2 {
  margin: 0;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .55px;
}

.section-title span {
  color: var(--muted);
  font-size: 7px;
}

.kpis {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}

.kpi {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 9px;
  background: var(--soft-2);
  min-height: 62px;
}

.kpi-label {
  display: block;
  color: var(--muted);
  font-size: 7px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.kpi-value {
  display: block;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -.3px;
}

.kpi-detail {
  margin-top: 3px;
  color: #7a8494;
  font-size: 7px;
}

.card {
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}

.card-header {
  padding: 6px 8px;
  background: var(--soft);
  border-bottom: 1px solid var(--line);
  font-weight: 800;
  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: .45px;
}

.card-body { padding: 9px; }

.summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.summary-item { margin-bottom: 7px; }
.summary-item:last-child { margin-bottom: 0; }

.summary-label {
  display: block;
  color: var(--muted);
  font-size: 7px;
  text-transform: uppercase;
  margin-bottom: 2px;
}

.summary-value { font-weight: 700; }

.table-wrap {
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead { display: table-header-group; }

th {
  background: var(--ink);
  color: #fff;
  padding: 7px 6px;
  font-size: 7.5px;
  text-align: left;
  font-weight: 800;
}

td {
  padding: 7px 6px;
  border-bottom: 1px solid #e4e7ec;
  font-size: 8px;
  vertical-align: top;
}

tbody tr:nth-child(even) { background: #fafbfc; }
tbody tr:last-child td { border-bottom: 0; }

.right { text-align: right; }
.center { text-align: center; }

.note {
  padding: 9px 10px;
  border-left: 4px solid var(--ink);
  background: var(--soft);
  color: #4f596b;
}

.total-row td {
  background: var(--soft);
  font-weight: 800;
  border-top: 1px solid var(--line);
}

.total-row td:last-child { font-size: 10px; }

.footer {
  margin-top: 16px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: 7px;
}

.footer strong { color: var(--ink); }

.empty {
  padding: 16px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed #cbd2dc;
  border-radius: 6px;
}

.page-break { break-before: page; }

@media print {
  body { background: #fff; }
  .page { margin: 0; box-shadow: none; }
  .toolbar { display: none !important; }
}

@media (max-width: 800px) {
  .page {
    width: calc(100% - 24px);
    min-height: auto;
    margin: 12px auto;
    padding: 18px;
  }

  .header,
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr;
  }

  .meta-box { width: 100%; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .table-wrap { overflow-x: auto; }
  table { min-width: 620px; }
}
</style>
</head>

<body>

<div class="toolbar">
  <button type="button" onclick="window.print()">Imprimir / Guardar PDF</button>
</div>

<main class="page" id="report">

  <header class="header">
    <div class="brand">
      <div class="brand-mark" id="brandMark">PP</div>
      <div>
        <h1 class="brand-name" id="brandName">Portal Pilot</h1>
        <div class="brand-tagline" id="brandTagline">Business Management Platform</div>
      </div>
    </div>

    <div class="meta-box">
      <div class="meta-title" id="metaTitle">Reporte empresarial</div>
      <div class="meta-body">
        <div class="meta-row"><span>Reporte</span><strong id="reportNumber">REP-000001</strong></div>
        <div class="meta-row"><span>Fecha</span><strong id="generatedAt">—</strong></div>
        <div class="meta-row"><span>Moneda</span><strong id="currency">HNL — Lempira</strong></div>
      </div>
    </div>
  </header>

  <section class="report-intro">
    <div class="eyebrow" id="eyebrow">Reporte generado por Portal Pilot IA</div>
    <h2 class="report-title" id="title">Reporte empresarial</h2>
    <p class="report-description" id="description"></p>
    <div class="period" id="period" hidden></div>
  </section>

  <section class="section" id="kpiSection" hidden>
    <div class="section-title">
      <h2>Resumen</h2>
      <span id="kpiCaption"></span>
    </div>
    <div class="kpis" id="kpis"></div>
  </section>

  <section class="section" id="summarySection" hidden>
    <div class="section-title"><h2>Información general</h2></div>
    <div class="summary-grid" id="summaryCards"></div>
  </section>

  <section class="section" id="tableSection" hidden>
    <div class="section-title">
      <h2 id="tableTitle">Detalle</h2>
      <span id="tableCaption"></span>
    </div>
    <div class="table-wrap">
      <table id="dataTable">
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>

  <section class="section" id="noteSection" hidden>
    <div class="section-title"><h2>Observaciones</h2></div>
    <div class="note" id="note"></div>
  </section>

  <footer class="footer">
    <div><strong id="footerBrand">Portal Pilot</strong> &nbsp;|&nbsp; Reporte generado por la plataforma</div>
    <div id="footerCompany"></div>
    <div id="footerPage">Página 1</div>
  </footer>

</main>

<script>
/*
  PLANTILLA UNIVERSAL DE REPORTES PORTAL PILOT
  --------------------------------------------
  La IA/app debe entregar un objeto JSON con esta estructura:

  {
    "company": {
      "name": "Empresa Cliente",
      "logo": "https://...",
      "tagline": "Sistema de gestión empresarial"
    },
    "report": {
      "number": "REP-000123",
      "type": "Reporte de gastos",
      "title": "Reporte de gastos",
      "description": "Gastos registrados durante septiembre de 2026.",
      "period": "01/09/2026 — 22/09/2026",
      "generatedAt": "22/09/2026 21:05",
      "currency": "HNL — Lempira"
    },
    "kpis": [
      {"label":"Total gastos","value":"L 25,500.00","detail":"42 registros"},
      {"label":"Promedio","value":"L 607.14","detail":"por operación"}
    ],
    "summary": [
      {"label":"Categoría principal","value":"Operación"},
      {"label":"Mayor gasto","value":"L 4,800.00"}
    ],
    "table": {
      "title": "Detalle de gastos",
      "caption": "42 registros",
      "columns": [
        {"key":"fecha","label":"Fecha"},
        {"key":"concepto","label":"Concepto"},
        {"key":"categoria","label":"Categoría"},
        {"key":"metodo","label":"Método"},
        {"key":"monto","label":"Monto","align":"right"}
      ],
      "rows": [
        {"fecha":"01/09/2026","concepto":"Compra de suministros","categoria":"Operación","metodo":"Transferencia","monto":"L 1,250.00"}
      ],
      "total": {"label":"Total","value":"L 25,500.00"}
    },
    "note": "Texto opcional de observaciones."
  }

  IMPORTANTE:
  - La plantilla NO decide qué mostrar.
  - Si un bloque no viene en JSON, no se muestra.
  - La IA solo debe incluir datos respaldados por la consulta.
  - No se deben inventar registros, totales, fechas ni conclusiones.
*/

// CONTRATO DE INYECCIÓN (ReportData — lib/Shared/reportes/report_models.dart):
// La app inyecta este objeto como `window.PORTAL_PILOT_REPORT` (o via ?data=
// en URL). Cada bloque es OPCIONAL: si viene vacío/ausente, no se renderiza.
//   company { name, logo?, tagline? }
//   report  { number, type, title, description?, period?, generatedAt, currency }
//   kpis?        [{ label, value, detail? }]
//   kpiCaption?
//   summary?     [{ label, value }]
//   table?       { title?, caption?, columns[ {key,label,align?} ],
//                  rows[ {key: valor String} ], total? {label,value} }
//   note?        (texto de advertencia o marca de agua)
// Cualquier dato no contemplado aquí se ignora.

const DEFAULT_REPORT = {
  company: {
    name: "Portal Pilot",
    logo: "",
    tagline: "Business Management Platform"
  },
  report: {
    number: "REP-000001",
    type: "Reporte empresarial",
    title: "Reporte empresarial",
    description: "Documento generado a partir de la información solicitada.",
    period: "",
    generatedAt: new Date().toLocaleString("es-HN"),
    currency: "HNL — Lempira"
  }
};

function getInjectedData() {
  if (window.PORTAL_PILOT_REPORT && typeof window.PORTAL_PILOT_REPORT === "object") {
    return window.PORTAL_PILOT_REPORT;
  }

  const encoded = new URLSearchParams(location.search).get("data");
  if (encoded) {
    try { return JSON.parse(decodeURIComponent(encoded)); } catch (e) {}
  }

  return DEFAULT_REPORT;
}

const data = getInjectedData();

const $ = id => document.getElementById(id);
const text = value => String(value ?? "");
const esc = value => text(value)
  .replace(/&/g, "&amp;")
  .replace(/</g, "&lt;")
  .replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;")
  .replace(/'/g, "&#039;");

function set(id, value) {
  const el = $(id);
  if (el && value !== undefined && value !== null && value !== "") el.textContent = value;
}

function renderCompany() {
  const c = data.company || {};
  set("brandName", c.name || "Portal Pilot");
  set("footerBrand", c.name || "Portal Pilot");
  set("brandTagline", c.tagline || "Business Management Platform");
  set("footerCompany", c.name || "");

  const mark = $("brandMark");
  if (c.logo) {
    mark.innerHTML = '<img src="' + esc(c.logo) + '" alt="Logo">';
    mark.style.background = "transparent";
  }
}

function renderHeader() {
  const r = data.report || {};
  set("metaTitle", r.type || "Reporte empresarial");
  set("reportNumber", r.number || "REP-000001");
  set("generatedAt", r.generatedAt || new Date().toLocaleString("es-HN"));
  set("currency", r.currency || "HNL — Lempira");
  set("title", r.title || r.type || "Reporte empresarial");
  set("description", r.description || "");

  const period = $("period");
  if (r.period) {
    period.hidden = false;
    period.textContent = r.period;
  }
}

function renderKpis() {
  const items = Array.isArray(data.kpis) ? data.kpis : [];
  if (!items.length) return;

  $("kpiSection").hidden = false;
  $("kpiCaption").textContent = data.kpiCaption || "";

  $("kpis").innerHTML = items.map(k => `
    <div class="kpi">
      <span class="kpi-label">${esc(k.label)}</span>
      <span class="kpi-value">${esc(k.value)}</span>
      ${k.detail ? `<div class="kpi-detail">${esc(k.detail)}</div>` : ""}
    </div>
  `).join("");
}

function renderSummary() {
  const items = Array.isArray(data.summary) ? data.summary : [];
  if (!items.length) return;

  $("summarySection").hidden = false;
  $("summaryCards").innerHTML = items.map(item => `
    <div class="card">
      <div class="card-header">${esc(item.label || "Información")}</div>
      <div class="card-body">
        <div class="summary-value">${esc(item.value)}</div>
      </div>
    </div>
  `).join("");
}

function renderTable() {
  const table = data.table;
  if (!table || !Array.isArray(table.columns) || !Array.isArray(table.rows)) return;

  $("tableSection").hidden = false;
  set("tableTitle", table.title || "Detalle");
  set("tableCaption", table.caption || "");

  $("tableHead").innerHTML = table.columns.map(col => `
    <th class="${col.align === "right" ? "right" : col.align === "center" ? "center" : ""}">
      ${esc(col.label || col.key)}
    </th>
  `).join("");

  $("tableBody").innerHTML = table.rows.length
    ? table.rows.map(row => `
      <tr>
        ${table.columns.map(col => `
          <td class="${col.align === "right" ? "right" : col.align === "center" ? "center" : ""}">
            ${esc(row[col.key])}
          </td>
        `).join("")}
      </tr>
    `).join("")
    : `<tr><td colspan="${table.columns.length}" class="center">No hay registros para mostrar.</td></tr>`;

  if (table.total && table.columns.length) {
    const cells = table.columns.map((_, i) => {
      if (i === table.columns.length - 2) return `<td class="right total-row">${esc(table.total.label || "Total")}</td>`;
      if (i === table.columns.length - 1) return `<td class="right">${esc(table.total.value)}</td>`;
      return "<td></td>";
    }).join("");

    $("tableBody").insertAdjacentHTML("beforeend", `<tr class="total-row">${cells}</tr>`);
  }
}

function renderNote() {
  if (!data.note) return;
  $("noteSection").hidden = false;
  $("note").textContent = data.note;
}

function init() {
  renderCompany();
  renderHeader();
  renderKpis();
  renderSummary();
  renderTable();
  renderNote();
}

init();
</script>

</body>
</html>
