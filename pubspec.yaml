name: portal_pilot_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  intl: ^0.18.0
  shared_preferences: ^2.0.20
  url_launcher: ^6.1.9
  http: ^1.2.0
  posthog_flutter: ^5.30.0
  supabase_flutter: ^2.16.0
  file_picker: ^6.1.1
  flutter_markdown: ^0.6.18  # Para renderizar markdown
  speech_to_text: ^6.6.0     # Para voz a texto
  share_plus: ^7.2.1         # Para compartir chat
  path_provider: ^2.1.1      # Para guardar archivos

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/Areas/Educacion/img/iconos/pp.edu.png
    - lib/Areas/Educacion/img/educacion.png
    - assets/img/
