name: portal_pilot_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.5+2

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.4.3
  google_fonts: ^8.1.0
  intl: ^0.18.0
  shared_preferences: ^2.0.20
  url_launcher: ^6.1.9
  http: ^1.2.0
  posthog_flutter: ^5.30.0
  supabase_flutter: ^2.16.0
  # file_picker: ^6.1.1  # disabled for Windows release build (native implementations conflict)
  flutter_markdown: ^0.6.18
  # speech_to_text: ^6.6.0  # disabled for Windows
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  connectivity_plus: ^6.0.3
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.9.0
  json_annotation: ^4.9.0
  uuid: ^4.0.0
  # POS Hardware dependencies
  mobile_scanner: ^5.1.1          # Escáner códigos de barras (cámara)
  permission_handler: ^11.3.0     # Permisos cámara/bluetooth
  # bluetooth_print: any            # Impresión Bluetooth alternativa (roto con Flutter actual)
  # POS Features
  pdf: ^3.10.7                    # Generar PDF tickets
  printing: ^5.11.0               # Imprimir PDF
  image: ^4.1.7                   # Procesar logo para ticket
  image_picker: ^1.1.2            # Seleccionar imagen de producto
  # flutter_sound: ^9.2.13          # Sonido confirmación venta
  # Mobile notifications
  firebase_messaging: ^15.0.0      # Notificaciones push
  flutter_local_notifications: ^17.0.0  # Notificaciones locales
  # Biometric authentication
  local_auth: ^2.1.0               # Autenticación biométrica

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0         # Generador de código Drift
  build_runner: ^2.4.9       # Ejecutar generadores
  json_serializable: ^6.8.0  # Generar to/from JSON

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - img/fondos-img/fondo-panel-modulos.jpg
    - img/fondos-img/fondo-dentro-modulos.jpg
    - img/fondos-img/onboarding-fondo.jpg
    - img/fondos-img/foto-login-abarrotista.jpg
    - img/fondos-img/foto-login-tegus-bandera.jpg
