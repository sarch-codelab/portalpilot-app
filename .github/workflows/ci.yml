name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: flutter analyze (con anotaciones de diagnóstico)
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos --machine > analyze_report.txt 2>&1
          code=$?
          python3 tool/ci/analyze_annotations.py analyze_report.txt || true
          exit $code
      - name: flutter test
        run: |
          set +e
          flutter test --no-pub > test_report.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            python3 tool/ci/test_annotations.py test_report.txt || true
          fi
          exit $code
