name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: flutter analyze (con anotaciones de diagnóstico)
        run: |
          set +e
          { flutter --version; echo '--- stderr de flutter analyze ---'; } > analyze_err.txt 2>&1
          flutter analyze --no-pub --no-fatal-infos --machine > analyze_report.json 2>> analyze_err.txt
          code=$?
          python3 tool/ci/analyze_annotations.py analyze_report.json analyze_err.txt || true
          exit $code
      - name: flutter test
        run: flutter test --no-pub
