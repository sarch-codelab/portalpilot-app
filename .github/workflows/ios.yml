name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios.yml'

jobs:
  build-ios:
    name: Build unsigned iOS .ipa
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tool versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS app (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -e
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr PortalPilot-unsigned.ipa Payload
          ls -lh PortalPilot-unsigned.ipa
          unzip -l PortalPilot-unsigned.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortalPilot-unsigned-ipa
          path: PortalPilot-unsigned.ipa
          if-no-files-found: error
